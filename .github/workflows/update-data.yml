name: Update DC Catalog Data

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Rebuild release order data
        run: node scripts/combineReleaseData.js

      - name: Fetch DCU / DCUAOM catalogs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/fetchDCUAuto.js

      - name: Fetch DC animations catalog
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/fetchAnimationsAuto.js

      - name: Commit updated data
        run: git config user.name github-actions[bot] && git config user.email github-actions[bot]@users.noreply.github.com && git add Data/ && git diff --staged --quiet || (git commit -m Auto-update-DC-catalog-data && git push)
